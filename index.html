<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DeviceLifeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Apply saved theme before paint to avoid light→dark flash -->
    <script>
      try {
        var raw = localStorage.getItem('devicelifeline.preferences.v1');
        var theme = 'light';
        if (raw) {
          var p = JSON.parse(raw);
          if (p && (p.theme === 'dark' || p.theme === 'light')) theme = p.theme;
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
