[package]
name = "device-lifeline"
version = "0.3.0"
authors = ["DriftLynx Technologies"]
edition = "2021"
rust-version = "1.77"
default-run = "device-lifeline"

[lib]
name = "devicelifeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "device-lifeline-agent"
path = "src/bin/device_lifeline_agent.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
thiserror = "1"
log = "0.4"
sysinfo = "0.33"
sha2 = "0.10"
ureq = { version = "2.12", default-features = true, features = ["json"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
